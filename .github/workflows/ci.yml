name: CI

on:
  push:
    branches: [main, master, Nuke_bug, event_readability_updates]
  pull_request:

jobs:
  lint:
    # PERF-02: lint and the migration checks run once, beside the test shards.
    # Its services, env and setup steps are kept in step with `test`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_test
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SETTINGS_MODULE: laserforce_simulator.settings
      SECRET_KEY: ${{ secrets.DJANGO_CI_SECRET_KEY || 'django-insecure-ci-only-not-a-real-secret' }}
      DEBUG: "True"
      DATABASE_URL: postgres://laserforce:laserforce@localhost:5432/laserforce_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laserforce_simulator/requirements.txt

      - name: Lint (ruff, black, encoding, SQLite JSON lookups, actionlint)
        # Narrow guardrail configured in pyproject.toml: ruff F401/F811 (dead
        # and duplicate imports), black formatting, a mojibake / non-UTF-8
        # scan of tracked text files, JSONField __contains / __contained_by
        # lookups (unsupported on the SQLite dev database, PERF-03), and
        # actionlint on the workflows (a rejected workflow runs no jobs at
        # all; ANG-04 found one that had been rejected for months). Versions
        # pinned so CI matches local runs.
        run: |
          python -m pip install ruff==0.17.1 black==26.10.1 actionlint-py==1.7.12.25
          ruff check .
          black --check laserforce_simulator
          python scripts/check_encoding.py
          python scripts/check_sqlite_json_lookups.py
          actionlint -shellcheck=

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./laserforce_simulator/requirements.txt

      - name: Check for missing migrations
        working-directory: ./laserforce_simulator
        # E-1 guard: fail CI if a model change has no generated migration,
        # so contributors can't ship models that are out of sync with the
        # migration history (the "unapplied/forgotten migration" footgun).
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: ./laserforce_simulator
        run: |
          python manage.py migrate --noinput

  test:
    # PERF-02: the suite is split across 4 runners by pytest-split, balanced
    # on the committed laserforce_simulator/.test_durations (a test missing
    # from it still runs, at the average duration). Each shard keeps its
    # coverage data for the `coverage` job to combine. The services, env and
    # setup steps are kept in step with `lint`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_test
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SETTINGS_MODULE: laserforce_simulator.settings
      SECRET_KEY: ${{ secrets.DJANGO_CI_SECRET_KEY || 'django-insecure-ci-only-not-a-real-secret' }}
      DEBUG: "True"
      DATABASE_URL: postgres://laserforce:laserforce@localhost:5432/laserforce_test
      # Coverage measures through sys.monitoring (Python 3.12+) instead of the
      # sys.settrace default. Line coverage only, as before.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laserforce_simulator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./laserforce_simulator/requirements.txt

      - name: Run tests with coverage (shard ${{ matrix.group }} of 4)
        working-directory: ./laserforce_simulator
        # --durations lists the slowest tests in every log, so a slowdown is
        # easy to find. --splits must match the matrix size. PERF-04: after
        # the split has read the committed .test_durations, --store-durations
        # --clean-durations overwrites this runner's copy with only this
        # shard's CI-measured timings, kept below for
        # scripts/refresh_test_durations.py.
        run: |
          pytest --splits 4 --group ${{ matrix.group }} --durations-path .test_durations --store-durations --clean-durations --cov=. --cov-report= --durations=25
          mv .coverage .coverage.shard${{ matrix.group }}

      - name: Keep this shard's coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.group }}
          path: laserforce_simulator/.coverage.shard${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Keep this shard's test durations
        # Only on success (the default): a red run never feeds the file.
        # 30 days, so a refresh can pick runs from weeks ago.
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.group }}
          path: laserforce_simulator/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  coverage:
    # Combines the shards' coverage data and uploads one report to Codecov.
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        # The version pinned in requirements.txt, so the combiner always
        # matches the version that wrote the shards' data.
        run: python -m pip install "$(grep -E '^coverage==' laserforce_simulator/requirements.txt)"

      - name: Download the shards' coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: laserforce_simulator

      - name: Combine coverage
        working-directory: ./laserforce_simulator
        run: |
          coverage combine
          coverage xml -o coverage.xml
          coverage report --format=total

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: coverage-report
          files: ./laserforce_simulator/coverage.xml

  test-result:
    # The one Python check: green only when lint, every shard and the coverage
    # upload passed, so the shard count can change without touching any
    # required-check setting.
    if: always()
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, test, coverage: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  frontend:
    # ANG-04: the Angular SPA in /frontend (ADR-0042). Runs in parallel with the Python jobs.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm run test:ci

      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test-result, frontend]
    env:
      # Job-level so the deploy steps' `if:` can test it: the `secrets`
      # context is not allowed in a step-level `if`, only `env` is.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_smoke
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t laserforce-simulator .

      - name: Smoke test
        run: |
          docker run -d --name smoke \
            --network host \
            -e SECRET_KEY=smoke-test-only-not-real \
            -e DEBUG=True \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://laserforce:laserforce@localhost:5432/laserforce_smoke \
            laserforce-simulator
          trap 'docker stop smoke 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/; then
              echo "App is ready after ${i}s"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "App did not become ready after 30s"
            docker logs smoke
            exit 1
          fi
          curl -f -L http://localhost:8000/

      - name: Set up flyctl
        if: github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
