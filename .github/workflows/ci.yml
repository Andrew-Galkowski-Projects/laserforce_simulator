name: CI

on:
  push:
    branches: [main, master, Nuke_bug, event_readability_updates]
    # DESK-02: a version tag publishes a numbered Desktop build Release.
    tags: ['v*']
  pull_request:

env:
  # DESK-02: the Desktop build's asset name, which desktop/build.ps1 writes. The
  # desktop-latest download link ends in it, so a rename breaks that link.
  ZIP: LaserforceSimulator-windows-x64.zip

jobs:
  lint:
    # PERF-02: lint and the migration checks run once, beside the test shards.
    # Its services, env and setup steps are kept in step with `test`.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_test
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SETTINGS_MODULE: laserforce_simulator.settings
      SECRET_KEY: ${{ secrets.DJANGO_CI_SECRET_KEY || 'django-insecure-ci-only-not-a-real-secret' }}
      DEBUG: "True"
      DATABASE_URL: postgres://laserforce:laserforce@localhost:5432/laserforce_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            laserforce_simulator/requirements.txt
            laserforce_simulator/requirements-desktop.txt
            laserforce_simulator/requirements-runtime.txt

      - name: Lint (ruff, black, encoding, SQLite JSON lookups, actionlint)
        # Narrow guardrail configured in pyproject.toml: ruff F401/F811 (dead
        # and duplicate imports), black formatting, a mojibake / non-UTF-8
        # scan of tracked text files, JSONField __contains / __contained_by
        # lookups (unsupported on the SQLite dev database, PERF-03), and
        # actionlint on the workflows (a rejected workflow runs no jobs at
        # all; ANG-04 found one that had been rejected for months). Versions
        # pinned so CI matches local runs.
        run: |
          python -m pip install ruff==0.17.1 black==26.10.1 actionlint-py==1.7.12.25
          ruff check .
          black --check laserforce_simulator
          python scripts/check_encoding.py
          python scripts/check_sqlite_json_lookups.py
          actionlint -shellcheck=

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./laserforce_simulator/requirements.txt

      - name: Check for missing migrations
        working-directory: ./laserforce_simulator
        # E-1 guard: fail CI if a model change has no generated migration,
        # so contributors can't ship models that are out of sync with the
        # migration history (the "unapplied/forgotten migration" footgun).
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run migrations
        working-directory: ./laserforce_simulator
        run: |
          python manage.py migrate --noinput

  test:
    # PERF-02: the suite is split across 4 runners by pytest-split, balanced
    # on the committed laserforce_simulator/.test_durations (a test missing
    # from it still runs, at the average duration). Each shard keeps its
    # coverage data for the `coverage` job to combine. The services, env and
    # setup steps are kept in step with `lint`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_test
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DJANGO_SETTINGS_MODULE: laserforce_simulator.settings
      SECRET_KEY: ${{ secrets.DJANGO_CI_SECRET_KEY || 'django-insecure-ci-only-not-a-real-secret' }}
      DEBUG: "True"
      DATABASE_URL: postgres://laserforce:laserforce@localhost:5432/laserforce_test
      # Coverage measures through sys.monitoring (Python 3.12+) instead of the
      # sys.settrace default. Line coverage only, as before.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            laserforce_simulator/requirements.txt
            laserforce_simulator/requirements-desktop.txt
            laserforce_simulator/requirements-runtime.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./laserforce_simulator/requirements.txt

      - name: Run tests with coverage (shard ${{ matrix.group }} of 4)
        working-directory: ./laserforce_simulator
        # --durations lists the slowest tests in every log, so a slowdown is
        # easy to find. --splits must match the matrix size. PERF-04: after
        # the split has read the committed .test_durations, --store-durations
        # --clean-durations overwrites this runner's copy with only this
        # shard's CI-measured timings, kept below for
        # scripts/refresh_test_durations.py.
        run: |
          pytest --splits 4 --group ${{ matrix.group }} --durations-path .test_durations --store-durations --clean-durations --cov=. --cov-report= --durations=25
          mv .coverage .coverage.shard${{ matrix.group }}

      - name: Check no test wrote into the real media/ dir
        # TEST-01: the root conftest points MEDIA_ROOT at a per-worker temp
        # dir, so a media/ folder here means a test bypassed MEDIA_ROOT.
        working-directory: ./laserforce_simulator
        run: |
          if [ -d media ]; then
            find media -type f | head -20
            echo "::error::Tests wrote into laserforce_simulator/media/; write under settings.MEDIA_ROOT instead."
            exit 1
          fi

      - name: Keep this shard's coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.group }}
          path: laserforce_simulator/.coverage.shard${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Keep this shard's test durations
        # Only on success (the default): a red run never feeds the file.
        # 30 days, so a refresh can pick runs from weeks ago.
        uses: actions/upload-artifact@v4
        with:
          name: durations-shard-${{ matrix.group }}
          path: laserforce_simulator/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  coverage:
    # Combines the shards' coverage data and uploads one report to Codecov.
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        # The version pinned in requirements.txt, so the combiner always
        # matches the version that wrote the shards' data.
        run: python -m pip install "$(grep -E '^coverage==' laserforce_simulator/requirements.txt)"

      - name: Download the shards' coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: laserforce_simulator

      - name: Combine coverage
        working-directory: ./laserforce_simulator
        run: |
          coverage combine
          coverage xml -o coverage.xml
          coverage report --format=total

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: coverage-report
          files: ./laserforce_simulator/coverage.xml

  test-result:
    # The one Python check: green only when lint, every shard and the coverage
    # upload passed, so the shard count can change without touching any
    # required-check setting.
    if: always()
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, test, coverage: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  frontend:
    # ANG-04: the Angular SPA in /frontend (ADR-0042). Runs in parallel with the Python jobs.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm run test:ci

      - name: Production build
        run: npm run build

  desktop:
    # DESK-02: build the Desktop build on a python.org CPython (not conda:
    # ADR-0048), smoke-test the frozen exe with the same steps the suite runs
    # unfrozen (desktop/smoke.py), and keep the zip. Every PR and push; only
    # desktop-publish publishes it.
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        # bash stops at the first failed command; a multi-line pwsh step
        # reports only the last command's exit code.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            laserforce_simulator/requirements-desktop.txt
            laserforce_simulator/requirements-runtime.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        # The desktop file (the runtime file plus pywebview, DESK-03; no test
        # tooling in the build) plus an exact PyInstaller, so a new release
        # cannot change the build unasked.
        run: |
          python -m pip install --upgrade pip
          pip install -r laserforce_simulator/requirements-desktop.txt pyinstaller==6.22.3
          npm --prefix frontend ci

      - name: Build
        shell: pwsh
        run: ./desktop/build.ps1 -Python python -Out build-out

      - name: Smoke-test the frozen build
        # DESK-03: --window then opens the real App window (WebView2) with
        # --selftest-window on a fresh data folder. Never skipped: a runner
        # that cannot show a window fails here.
        run: >-
          python desktop/smoke.py build-out/dist/LaserforceSimulator/LaserforceSimulator.exe
          --window
          --zip "build-out/$ZIP"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build
          path: build-out/${{ env.ZIP }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    # DESK-02: a push to main whose CI passed replaces the asset on the rolling
    # desktop-latest pre-release (the release is never deleted, so its
    # download link never changes); a v* tag publishes a numbered Release. A
    # failed job above publishes nothing.
    needs: [test-result, frontend, desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queued, not cancelled: two merges publish in order.
    concurrency:
      group: desktop-latest
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Desktop build
        uses: actions/download-artifact@v4
        with:
          name: desktop-build

      - name: Publish the Latest desktop build
        if: github.ref == 'refs/heads/main'
        # A tag pushed with GITHUB_TOKEN starts no workflow run, and
        # desktop-latest does not match v* anyway.
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; that run publishes desktop-latest."
            exit 0
          fi
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest desktop build" --notes "First build."
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/desktop-latest"
          gh release upload desktop-latest "$ZIP" --clobber
          gh release edit desktop-latest --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%d) by run $GITHUB_RUN_ID. Unsigned: Windows SmartScreen warns; choose More info, then Run anyway."

      - name: Publish a numbered Release
        if: startsWith(github.ref, 'refs/tags/v')
        # DESK-04: a plain vX.Y.Z tag is a Release (the public download,
        # releases/latest); any other v* tag (v0.2.0-rc1) is a pre-release.
        # The notes are the committed download page plus GitHub's changelog.
        # Twin rule: RELEASE_TAG in laserforce_simulator/desktop_app/build_info.py,
        # which gives the build its channel; change both together.
        run: |
          kind=()
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag "${kind[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file desktop/RELEASE_NOTES.md --generate-notes

  docker:
    runs-on: ubuntu-latest
    needs: [test-result, frontend]
    env:
      # Job-level so the deploy steps' `if:` can test it: the `secrets`
      # context is not allowed in a step-level `if`, only `env` is.
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laserforce_smoke
          POSTGRES_USER: laserforce
          POSTGRES_PASSWORD: laserforce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t laserforce-simulator .

      - name: Smoke test
        run: |
          docker run -d --name smoke \
            --network host \
            -e SECRET_KEY=smoke-test-only-not-real \
            -e DEBUG=True \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://laserforce:laserforce@localhost:5432/laserforce_smoke \
            laserforce-simulator
          trap 'docker stop smoke 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/admin/login/; then
              echo "App is ready after ${i}s"
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "App did not become ready after 30s"
            docker logs smoke
            exit 1
          fi
          curl -f -L http://localhost:8000/admin/login/
          # ADR-0049: the same container serves the SPA itself.
          bash scripts/smoke_spa.sh || { docker logs smoke; exit 1; }

      - name: Set up flyctl
        if: github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: github.ref == 'refs/heads/main' && env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
