<section class="login">
  <h1>Sign in</h1>
  <p class="login__app">{{ title }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" required />
      @if (form.controls.email.hasError('required')) {
        <mat-error>Enter your email.</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      />
      @if (form.controls.password.hasError('required')) {
        <mat-error>Enter your password.</mat-error>
      }
    </mat-form-field>
    <button mat-flat-button type="submit" [disabled]="busy()">Sign in</button>
  </form>
</section>
