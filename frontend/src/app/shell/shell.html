<header>
  <mat-toolbar>
    @if (!wide()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Toggle navigation"
        class="shell__toggle"
        (click)="nav.toggle()"
      >
        <span aria-hidden="true">&#9776;</span>
      </button>
    }
    <span class="shell__title">{{ title }}</span>
    <span class="shell__spacer"></span>
    @if (roomy()) {
      <button
        mat-button
        type="button"
        class="shell__account"
        aria-label="Account"
        [attr.title]="user()?.email"
        [matMenuTriggerFor]="account"
      >
        <span class="shell__user">{{ user()?.email }}</span>
      </button>
    } @else {
      <button
        mat-icon-button
        type="button"
        aria-label="Account"
        [attr.title]="user()?.email"
        [matMenuTriggerFor]="account"
      >
        <span aria-hidden="true" class="shell__avatar">{{ initial() }}</span>
      </button>
    }
  </mat-toolbar>
</header>
<mat-menu #account="matMenu" xPosition="before">
  @if (user()?.self_insert; as player) {
    <a mat-menu-item [routerLink]="['/teams', player.team]">My player</a>
    <button mat-menu-item type="button" (click)="unlinkSelfInsert()">Unlink Self-insert</button>
  }
  <a mat-menu-item routerLink="/account/password">Change password</a>
  <button mat-menu-item type="button" (click)="signOut()">Sign out</button>
</mat-menu>
<mat-sidenav-container class="shell__body">
  <mat-sidenav #nav [mode]="wide() ? 'side' : 'over'" [opened]="wide()" class="shell__nav">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/teams"
        routerLinkActive="shell__link--active"
        (click)="wide() || nav.close()"
        >Teams</a
      >
      <a
        mat-list-item
        routerLink="/matches"
        routerLinkActive="shell__link--active"
        (click)="wide() || nav.close()"
        >Matches</a
      >
      <a
        mat-list-item
        routerLink="/maps"
        routerLinkActive="shell__link--active"
        (click)="wide() || nav.close()"
        >Maps</a
      >
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
