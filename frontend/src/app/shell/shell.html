<header>
  <mat-toolbar>
    @if (!wide()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Toggle navigation"
        class="shell__toggle"
        (click)="nav.toggle()"
      >
        <span aria-hidden="true">&#9776;</span>
      </button>
    }
    <span class="shell__title">{{ title }}</span>
    <span class="shell__spacer"></span>
    <span class="shell__user">{{ user()?.email }}</span>
    <button mat-button type="button" (click)="signOut()">Sign out</button>
  </mat-toolbar>
</header>
<mat-sidenav-container class="shell__body">
  <mat-sidenav #nav [mode]="wide() ? 'side' : 'over'" [opened]="wide()" class="shell__nav">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/teams"
        routerLinkActive="shell__link--active"
        (click)="wide() || nav.close()"
        >Teams</a
      >
      <a
        mat-list-item
        routerLink="/matches"
        routerLinkActive="shell__link--active"
        (click)="wide() || nav.close()"
        >Matches</a
      >
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
