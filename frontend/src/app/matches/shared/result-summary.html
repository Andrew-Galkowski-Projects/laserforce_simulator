<h1 class="summary__teams">
  <span class="summary__team" data-lf-side="red"
    ><span class="summary__badge" aria-hidden="true">R</span>{{ redName() }}</span
  >
  <span class="summary__vs">vs</span>
  <span class="summary__team" data-lf-side="blue"
    ><span class="summary__badge" aria-hidden="true">B</span>{{ blueName() }}</span
  >
</h1>
<dl class="summary__facts">
  <div>
    <dt>Score</dt>
    <dd class="summary__score">{{ redScore() }} - {{ blueScore() }}</dd>
  </div>
  <div>
    <dt>Winner</dt>
    <dd><app-result-chip [result]="result()" /></dd>
  </div>
  <div>
    <dt>Played</dt>
    <dd>{{ datePlayed() | date: 'MMM d, y HH:mm' }}</dd>
  </div>
</dl>
<p class="summary__back">
  <a mat-stroked-button routerLink="/matches">&larr; Back to Matches</a>
</p>
