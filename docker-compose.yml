services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: laserforce
      POSTGRES_USER: laserforce
      POSTGRES_PASSWORD: laserforce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laserforce"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - laserforce_simulator/.env
    environment:
      DATABASE_URL: postgres://laserforce:laserforce@db:5432/laserforce
    depends_on:
      db:
        condition: service_healthy

  # ANG-07 (ADR-0046): the front door. The SPA at http://localhost:8080/app/,
  # every other path proxied to app; app's own 8000 stays published.
  nginx:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  postgres_data:
