# Mirrors the CI lint step (.github/workflows/ci.yml). Install locally with
#   python -m pip install pre-commit && pre-commit install
# Rule selection for ruff lives in pyproject.toml (F401/F811 only).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        files: ^laserforce_simulator/
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        args: [-shellcheck=]
  - repo: local
    hooks:
      # CI's frontend job runs `format:check`; this catches it at commit time.
      - id: prettier
        name: prettier --check (frontend)
        entry: npx --prefix frontend prettier --check --ignore-unknown --ignore-path frontend/.prettierignore
        language: system
        files: ^frontend/
      - id: check-encoding
        name: check encoding (mojibake / non-UTF-8)
        entry: python scripts/check_encoding.py
        language: system
        # Every text file: the script itself filters by TEXT_SUFFIXES, its
        # single source of truth.
        types: [text]
