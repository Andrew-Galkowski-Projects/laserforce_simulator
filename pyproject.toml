# Tool configuration only -- this repo is not a packaged distribution.
# The Django project lives in laserforce_simulator/ (see CLAUDE.md).

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "**/migrations/**",
    ".claude/worktrees",
    ".venv",
    ".conda",
]

[tool.ruff.lint]
# Deliberately narrow guardrail: dead imports only. Formatting is black's job.
#   F401 unused import, F811 redefinition of an unused name (duplicate import)
select = ["F401", "F811"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
